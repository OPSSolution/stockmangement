services:
  - type: web
    name: stockmanagement
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production npx tsx server/index.ts
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Dumps every public-schema table to Supabase Storage daily — Supabase's free
  # tier has no built-in automated backups. Cron services aren't available on
  # Render's free plan, unlike the web service above; "starter" is the cheapest
  # tier that supports them.
  - type: cron
    name: stockmanagement-backup
    runtime: node
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: npm install
    startCommand: npx tsx server/scripts/backupDatabase.ts
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
